[tool.poetry]
name = "pixelboost-backend"
version = "0.1.0"
description = "PixelBoost — free unlimited image upscaler backend"
authors = ["minhajulofficial <akaqj@hook2ad.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.136.1"}
pillow = "^12.0"
python-multipart = "^0.0.29"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
